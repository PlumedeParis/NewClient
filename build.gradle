plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {}

loom {
	mods {
		"zero" { sourceSet sourceSets.main }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Headless in-game tests (not shipped in the mod jar): ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "zero-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// The test machine renders in software; Fabric's 10 s network watchdog can trip on slow frames.
loom.runs.configureEach {
	if (name == "clientGameTest") vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
}
